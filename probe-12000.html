<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你的兴趣行为 · 管理决策方法</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --line:#e3e8ef; --ink:#1f2d3d; --sub:#8a94a3;
    --blue:#2f6fb5; --blue-d:#245a94; --green:#3aa76d; --soft:#f6f8fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
    font-size:15px; line-height:1.6; padding:18px 14px 40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12.5px;margin:2px 2px 14px}
  .brand b{color:#5b6b7d;font-weight:600}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 2px 10px rgba(31,45,61,.05);overflow:hidden;margin-bottom:14px;
  }
  .card::before{content:"";display:block;height:4px;background:linear-gradient(90deg,#2f6fb5,#4d8ecf)}
  .card.accent::before{background:linear-gradient(90deg,#2f6fb5,#4d8ecf)}
  .pad{padding:18px 18px 20px}
  h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:.2px}
  h1 .q{color:var(--blue)}
  .hint{color:var(--sub);font-size:12.5px;margin:0 0 4px}
  .qbox{border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-top:14px;background:#fff}
  .qbox.incomplete{border-color:#e5c7c7;background:#fdf7f7}
  .qtitle{font-size:14.5px;font-weight:700;margin-bottom:2px}
  .qtitle .no{margin-right:4px}
  .qsub{color:var(--sub);font-size:12px;margin-bottom:10px}
  .opt{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;margin-top:9px;cursor:pointer;transition:border-color .15s,background .15s;
    background:#fff;user-select:none
  }
  .opt:active{transform:scale(.995)}
  .opt .badge{
    flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#eef1f5;color:#66717e;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center
  }
  .opt .txt{flex:1 1 auto;font-size:14.5px}
  .opt .score{color:#a7b0bb;font-size:12px}
  .opt .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid #d5dbe3;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
  .opt.sel{border-color:var(--blue);background:#f3f8fd}
  .opt.sel .badge{background:var(--blue);color:#fff}
  .opt.sel .tick{background:var(--blue);border-color:var(--blue)}
  .opt.sel .tick::after{content:"✓"}
  .btn{
    display:block;width:100%;margin-top:18px;border:0;border-radius:10px;background:var(--blue);
    color:#fff;font-size:16px;font-weight:700;padding:13px 16px;cursor:pointer;
    font-family:inherit;box-shadow:0 3px 10px rgba(47,111,181,.24)
  }
  .btn:active{background:var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid #cfe0f0;box-shadow:none}
  .foot{color:#a7b0bb;font-size:12px;text-align:center;margin-top:14px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:rgba(31,45,61,.92);color:#fff;font-size:13px;padding:9px 14px;border-radius:20px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 成功页 */
  .ok{padding:34px 22px 26px;text-align:center}
  .ok .mark{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:#eaf1f9;
    display:flex;align-items:center;justify-content:center}
  .ok .mark svg{width:30px;height:30px}
  .ok h2{font-size:21px;margin:0 0 8px}
  .ok p{color:var(--sub);font-size:13.5px;margin:0 0 20px}
  .recap{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-6px 0 20px}
  .recap span{background:var(--soft);border:1px solid var(--line);border-radius:20px;
    padding:4px 10px;font-size:12px;color:#5b6b7d}
  .hide{display:none}
  /* 大屏（平板 / 电脑直接打开这一页）时按比例放大，不糊成一团 */
  @media (min-width: 700px){
    body{font-size:17px;padding:30px 20px 52px}
    .wrap{max-width:640px}
    h1{font-size:22.5px}
    .hint{font-size:14px}
    .qbox{padding:17px 17px 15px;margin-top:17px}
    .qtitle{font-size:16.5px}
    .qsub{font-size:13.5px}
    .opt{padding:13px 14px;margin-top:11px;border-radius:11px}
    .opt .badge{width:25px;height:25px;font-size:13.5px}
    .opt .txt{font-size:16.5px}
    .btn{font-size:17.5px;padding:15px 18px}
    .ok h2{font-size:24px}
    .recap span{font-size:13.5px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><b>管理决策方法</b> · 协同过滤 · 课堂互动</div>

  <!-- ============ 问卷视图 ============ -->
  <div id="viewForm">
    <div class="card">
      <div class="pad">
        <h1><span class="q">Q |</span> 这三个视频，你做过哪个行为？</h1>
        <p class="hint">请凭你真实的第一反应，每题单选，共 3 题，选完点提交。</p>

        <div id="qbox"></div>

        <button class="btn" id="btnSubmit">提交</button>
      </div>
    </div>
  </div>

  <!-- ============ 成功视图 ============ -->
  <div id="viewDone" class="hide">
    <div class="card accent">
      <div class="ok">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2f6fb5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.8 9.4 18 20 6.6"></polyline></svg>
        </div>
        <h2>提交成功</h2>
        <p>你的选择已经提交，感谢参与。</p>
        <div class="recap" id="recap"></div>
        <button class="btn ghost" id="btnAgain">返回并重新选择</button>
      </div>
    </div>
    <div class="foot">匿名提交</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==== data.js（已内联，勿单独维护副本）==== */
﻿/* 协同过滤课堂演示 · 预设数据
 * 口径全部来自课件《管理决策方法 · 协同过滤》P9：
 *   视频① 排莫村·摩旅寻村 / 视频② 黔东南·染布人家 / 视频③ 排莫村·东方第一染
 *   行为→分值：点赞=1 评论=2 收藏=3 转发=4
 * 教师端矩阵为「预设随机数据」（会议决定：不用实时真实数据，避免不可控）：
 *   前 4 行 = 课件原四人，分值与 PPT 完全一致；后 36 行 = 固定种子随机生成的 36 位同学。
 *   固定种子 ⇒ 每次打开、每台机器上的矩阵都一模一样，讲稿里的数字可以放心引用。
 */
(function (global) {
  'use strict';

  var VIDEOS = [
    { id: 1, title: '排莫村·摩旅寻村', sub: '视频①' },
    { id: 2, title: '黔东南·染布人家', sub: '视频②' },
    { id: 3, title: '排莫村·东方第一染', sub: '视频③' }
  ];

  var BEHAVIORS = [
    { key: 'like', label: '点赞', score: 1 },
    { key: 'comment', label: '评论', score: 2 },
    { key: 'collect', label: '收藏', score: 3 },
    { key: 'repost', label: '转发', score: 4 }
  ];

  /* 课件 PPT 原四人（评分矩阵，顺序与 PPT 表格一致） */
  var CANONICAL = [
    { name: '张三', scores: [4, 4, 4], tag: '目标用户' },
    { name: '李四', scores: [4, 3, 4] },
    { name: '王五', scores: [2, 2, 3] },
    { name: '赵六', scores: [2, 1, 3] }
  ];

  /* 六个潜在兴趣原型（只在生成数据时使用，界面上不显示，
     课堂上由算法自己"发现"出来——这是可视化要卖的点。
     故意拉开方向差异，避免全班都挤在一个窄锥里。 */
  var PROTOTYPES = [
    [4, 1, 2],
    [1, 4, 3],
    [2, 3, 4],
    [4, 3, 1],
    [1, 2, 4],
    [3, 4, 1]
  ];

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp4(x) { return Math.max(1, Math.min(4, Math.round(x))); }

  function build(nRandom, seed) {
    var rnd = mulberry32(seed);
    var rows = CANONICAL.map(function (r) {
      return { name: r.name, scores: r.scores.slice(), canonical: true, tag: r.tag || '' };
    });

    /* 取值 1..4 的三元组一共只有 64 种，全班要互不重复，就得从"还没用过的组合"里取 */
    var pool = [];
    for (var a = 1; a <= 4; a++) for (var b = 1; b <= 4; b++) for (var c = 1; c <= 4; c++) pool.push([a, b, c]);
    var key = function (v) { return v.join(''); };
    var used = {};
    rows.forEach(function (r) { used[key(r.scores)] = 1; });
    /* 与课件原四人"方向完全相同"的组合（(1,1,1)(2,2,2)(3,3,3) 与 张三 同向）不再使用，
       保证课堂上"张三最像李四"这个例子不被随机数据冲淡。
       注意：取值 1..4 的三元组一共只有 64 种，60 人几乎要用满整个空间。 */
    function banned(v) {
      for (var q = 0; q < CANONICAL.length; q++) {
        if (cosine(v, CANONICAL[q].scores) > 0.9999) return true;
      }
      return false;
    }

    function unused() {
      var left = pool.filter(function (v) { return !used[key(v)] && !banned(v); });
      return left.length ? left[Math.floor(rnd() * left.length)] : null;
    }
    function tryMake() {
      var proto = PROTOTYPES[Math.floor(rnd() * PROTOTYPES.length)];
      return proto.map(function (p) {
        var noise = (rnd() + rnd() - 1) * 1.9;
        return clamp4(p + noise);
      });
    }
    function maxCosTo(scores) {
      var m = 0;
      for (var k = 0; k < rows.length; k++) m = Math.max(m, cosine(scores, rows[k].scores));
      return m;
    }

    for (var i = 0; i < nRandom; i++) {
      var best = null, bestScore = 2;
      for (var t = 0; t < 400; t++) {                 // 先按兴趣原型采样：不重复 + 方向尽量分散
        var s = tryMake();
        if (used[key(s)] || banned(s)) continue;
        var mc = maxCosTo(s);
        if (mc <= 0.965) { best = s; break; }
        if (mc < bestScore) { bestScore = mc; best = s; }
      }
      if (!best || used[key(best)] || banned(best)) best = unused();  // 兜底：从未用过且不冲突的组合里任取
      used[key(best)] = 1;
      rows.push({
        name: '同学' + String(rows.length + 1).padStart(2, '0'),
        scores: best,
        canonical: false,
        tag: ''
      });
    }
    return rows;
  }

  /* ---- 算法工具（与课件公式一一对应） ---- */

  function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
  function norm(a) { return Math.sqrt(dot(a, a)); }

  /* 余弦相似度：cos θ = (A·B) / (|A|·|B|)  —— 课件 P16 */
  function cosine(a, b) {
    var d = norm(a) * norm(b);
    return d === 0 ? 0 : dot(a, b) / d;
  }

  /* 归一化方向向量：只保留方向，丢掉打分高低 */
  function unit(a) {
    var n = norm(a);
    return n === 0 ? a.slice() : a.map(function (x) { return x / n; });
  }

  /* 经典 MDS（等价于对中心化后的方向向量做 PCA）：
     把全班兴趣向量投到 2D，使 2D 欧氏距离 ≈ 夹角所决定的距离 sqrt(2-2cosθ)。
     这样"网络距离"就是"相似度"的直观翻译。 */
  function mds2(points) {
    var n = points.length, dim = points[0].length;
    var mean = new Array(dim).fill(0);
    points.forEach(function (p) { p.forEach(function (v, j) { mean[j] += v / n; }); });
    var X = points.map(function (p) { return p.map(function (v, j) { return v - mean[j]; }); });

    // 协方差矩阵
    var C = [];
    for (var i = 0; i < dim; i++) {
      C.push(new Array(dim).fill(0));
      for (var k = 0; k < dim; k++) {
        var s = 0;
        for (var m = 0; m < n; m++) s += X[m
